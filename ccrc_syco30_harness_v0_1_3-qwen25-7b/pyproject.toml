[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccrc-syco30-harness"
version = "0.1.3"
description = "Deterministic local LM Studio harness for a frozen SycoBench-600 subset"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
