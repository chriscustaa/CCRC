name: Offline harness tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install pytest "requests>=2.32,<3" "datasets>=4,<5"

      - name: Run each historical harness independently
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          failed=0
          while IFS= read -r harness_dir; do
            echo "::group::$harness_dir"
            (cd "$harness_dir" && python -m pytest -q) || failed=1
            echo "::endgroup::"
          done < <(find . -type d -name tests -printf '%h\n' | sort)
          exit "$failed"

      - name: Verify finalized evidence manifests
        run: |
          while IFS= read -r manifest; do
            base=$(dirname "$manifest")
            file=$(basename "$manifest")
            (cd "$base" && sha256sum -c "$file")
          done < <(find . -type f \( -name hashes.sha256 -o -name FROZEN_SHA256.txt \) | sort)
