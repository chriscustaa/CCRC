[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccrc-trajectory100"
version = "0.9.0"
description = "Frozen 100-item, five-stage cognitive-depth response-curve pilot"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3"]

[project.scripts]
ccrc-trajectory100 = "harness.cli:main"

[tool.setuptools]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
